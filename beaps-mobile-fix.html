document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

orange (energy);\n     paused/pending are neutral; danger is the hot end of orange (ember). */\n  --ember-500: #ff5a1f; /* danger / revoke / failed */\n  --ember-600: #e6491a;\n  --ember-glow: rgba(255, 90, 31, 0.4);\n\n  /* legacy hue names retained as aliases, remapped into the 2-color world,\n     so any component referencing them follows the palette automatically */\n  --green-500: var(--orange-500);\n  --green-400: var(--orange-400);\n  --green-600: var(--orange-600);\n  --green-glow: rgba(255, 140, 0, 0.45);\n  --red-500: var(--ember-500);\n  --red-600: var(--ember-600);\n  --red-glow: var(--ember-glow);\n  --amber-500: var(--neutral-300);\n  --amber-600: var(--neutral-400);\n  --blue-500: var(--neutral-300);\n  --blue-600: var(--neutral-400);\n\n  /* ---- Alpha utilities (over dark) ---- */\n  --white-a04: rgba(255, 255, 255, 0.04);\n  --white-a06: rgba(255, 255, 255, 0.06);\n  --white-a08: rgba(255, 255, 255, 0.08);\n  --white-a12: rgba(255, 255, 255, 0.12);\n  --white-a18: rgba(255, 255, 255, 0.18);\n  --orange-a12: rgba(255, 140, 0, 0.12);\n  --orange-a20: rgba(255, 140, 0, 0.2);\n  --orange-a40: rgba(255, 140, 0, 0.4);\n\n  /* ============================================================\n     SEMANTIC ALIASES — use these in components\n     ============================================================ */\n\n  /* Surfaces */\n  --surface-base: var(--neutral-950);\n  --surface-sunken: var(--neutral-1000);\n  --surface-card: var(--neutral-875);\n  --surface-raised: var(--neutral-850);\n  --surface-elevated: var(--neutral-800);\n  --surface-overlay: rgba(5, 5, 5, 0.72);\n\n  /* Text */\n  --text-primary: #fafafa;\n  --text-secondary: var(--neutral-400);\n  --text-tertiary: var(--neutral-500);\n  --text-disabled: var(--neutral-600);\n  --text-brand: var(--orange-500);\n  --text-on-brand: #1a0e00;\n  --text-inverse: var(--neutral-950);\n\n  /* Borders */\n  --border-subtle: var(--white-a06);\n  --border-default: var(--white-a12);\n  --border-strong: var(--white-a18);\n  --border-brand: var(--orange-500);\n  --border-focus: var(--orange-400);\n\n  /* Brand surfaces */\n  --brand-solid: var(--orange-500);\n  --brand-solid-hover: var(--orange-400);\n  --brand-solid-press: var(--orange-600);\n  --brand-tint: var(--orange-a12);\n  --brand-tint-strong: var(--orange-a20);\n\n  /* Status semantics — orange (alive) vs neutral (idle) vs ember (danger) */\n  --status-active: var(--orange-500);\n  --status-active-tint: var(--orange-a12);\n  --status-confirmed: var(--orange-500);\n  --status-paused: var(--neutral-300);\n  --status-paused-tint: rgba(255, 255, 255, 0.07);\n  --status-revoked: var(--ember-500);\n  --status-revoked-tint: rgba(255, 90, 31, 0.13);\n  --status-pending: var(--neutral-300);\n  --status-pending-tint: rgba(255, 255, 255, 0.07);\n\n  /* Danger (revoke) — hot orange, not red */\n  --danger-solid: var(--ember-500);\n  --danger-solid-hover: #ff723d;\n  --danger-solid-press: var(--ember-600);\n  --danger-tint: var(--status-revoked-tint);\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   TEFAMA — TYPOGRAPHY TOKENS\n   Geist for UI/display, Geist Mono for amounts, hashes, data.\n   Tight tracking on display sizes (brand signature).\n   ============================================================ */\n\n:root {\n  /* Families */\n  --font-sans: \"Geist\", -apple-system, BlinkMacSystemFont, \"Segoe UI\", system-ui, sans-serif;\n  --font-mono: \"Geist Mono\", \"SF Mono\", \"JetBrains Mono\", ui-monospace, monospace;\n\n  /* Weights */\n  --weight-light: 300;\n  --weight-regular: 400;\n  --weight-medium: 500;\n  --weight-semibold: 600;\n  --weight-bold: 700;\n\n  /* ---- Type scale (mobile-first, px) ---- */\n  --text-display-size: 40px;\n  --text-display-lh: 44px;\n  --text-display-track: -0.03em;\n\n  --text-h1-size: 32px;\n  --text-h1-lh: 36px;\n  --text-h1-track: -0.025em;\n\n  --text-h2-size: 24px;\n  --text-h2-lh: 30px;\n  --text-h2-track: -0.02em;\n\n  --text-h3-size: 20px;\n  --text-h3-lh: 26px;\n  --text-h3-track: -0.015em;\n\n  --text-title-size: 17px;\n  --text-title-lh: 24px;\n  --text-title-track: -0.01em;\n\n  --text-body-size: 15px;\n  --text-body-lh: 22px;\n  --text-body-track: -0.005em;\n\n  --text-label-size: 14px;\n  --text-label-lh: 20px;\n  --text-label-track: 0;\n\n  --text-caption-size: 13px;\n  --text-caption-lh: 18px;\n  --text-caption-track: 0;\n\n  --text-micro-size: 11px;\n  --text-micro-lh: 14px;\n  --text-micro-track: 0.04em;\n\n  /* Numeric / mono (balances, budgets, hashes) */\n  --text-mono-amount-track: -0.02em;\n  --text-mono-data-track: 0;\n}\n\n/* ---- Reusable type role classes (specimen-friendly) ---- */\n.t-display {\n  font-family: var(--font-sans);\n  font-weight: var(--weight-semibold);\n  font-size: var(--text-display-size);\n  line-height: var(--text-display-lh);\n  letter-spacing: var(--text-display-track);\n}\n.t-h1 {\n  font-family: var(--font-sans);\n  font-weight: var(--weight-semibold);\n  font-size: var(--text-h1-size);\n  line-height: var(--text-h1-lh);\n  letter-spacing: var(--text-h1-track);\n}\n.t-h2 {\n  font-family: var(--font-sans);\n  font-weight: var(--weight-semibold);\n  font-size: var(--text-h2-size);\n  line-height: var(--text-h2-lh);\n  letter-spacing: var(--text-h2-track);\n}\n.t-h3 {\n  font-family: var(--font-sans);\n  font-weight: var(--weight-medium);\n  font-size: var(--text-h3-size);\n  line-height: var(--text-h3-lh);\n  letter-spacing: var(--text-h3-track);\n}\n.t-title {\n  font-family: var(--font-sans);\n  font-weight: var(--weight-semibold);\n  font-size: var(--text-title-size);\n  line-height: var(--text-title-lh);\n  letter-spacing: var(--text-title-track);\n}\n.t-body {\n  font-family: var(--font-sans);\n  font-weight: var(--weight-regular);\n  font-size: var(--text-body-size);\n  line-height: var(--text-body-lh);\n  letter-spacing: var(--text-body-track);\n}\n.t-label {\n  font-family: var(--font-sans);\n  font-weight: var(--weight-medium);\n  font-size: var(--text-label-size);\n  line-height: var(--text-label-lh);\n  letter-spacing: var(--text-label-track);\n}\n.t-caption {\n  font-family: var(--font-sans);\n  font-weight: var(--weight-regular);\n  font-size: var(--text-caption-size);\n  line-height: var(--text-caption-lh);\n  letter-spacing: var(--text-caption-track);\n}\n.t-micro {\n  font-family: var(--font-sans);\n  font-weight: var(--weight-medium);\n  font-size: var(--text-micro-size);\n  line-height: var(--text-micro-lh);\n  letter-spacing: var(--text-micro-track);\n  text-transform: uppercase;\n}\n.t-mono {\n  font-family: var(--font-mono);\n  font-weight: var(--weight-medium);\n  letter-spacing: var(--text-mono-amount-track);\n  font-variant-numeric: tabular-nums;\n  font-feature-settings: \"tnum\" 1;\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   TEFAMA — SPACING & SIZING TOKENS\n   4px base grid. Mobile layout rhythm.\n   ============================================================ */\n\n:root {\n  --space-0: 0;\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 20px;\n  --space-6: 24px;\n  --space-7: 32px;\n  --space-8: 40px;\n  --space-9: 48px;\n  --space-10: 64px;\n  --space-12: 80px;\n\n  /* Layout */\n  --screen-pad: 20px;        /* default horizontal gutter on mobile */\n  --section-gap: 24px;       /* space between dashboard sections */\n  --card-pad: 18px;          /* default card interior padding */\n  --stack-gap: 12px;         /* default vertical gap inside groups */\n\n  /* Touch targets */\n  --tap-min: 48px;           /* minimum touch target */\n  --control-h-sm: 36px;\n  --control-h-md: 44px;\n  --control-h-lg: 52px;\n\n  /* Component sizing */\n  --icon-sm: 16px;\n  --icon-md: 20px;\n  --icon-lg: 24px;\n  --avatar-sm: 32px;\n  --avatar-md: 40px;\n  --avatar-lg: 56px;\n\n  --bottomnav-h: 64px;\n  --appbar-h: 56px;\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   TEFAMA — EFFECTS TOKENS\n   Radii, shadows, glows (the autonomous \"alive\" signature),\n   motion easings & durations.\n   ============================================================ */\n\n:root {\n  /* ---- Corner radii ---- */\n  --radius-xs: 6px;\n  --radius-sm: 10px;\n  --radius-md: 14px;\n  --radius-lg: 18px;\n  --radius-xl: 24px;\n  --radius-2xl: 30px;\n  --radius-pill: 999px;\n  --radius-circle: 50%;\n\n  /* ---- Shadows (over near-black canvas) ---- */\n  --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.4);\n  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.45);\n  --shadow-md: 0 6px 20px rgba(0, 0, 0, 0.5);\n  --shadow-lg: 0 14px 40px rgba(0, 0, 0, 0.6);\n  --shadow-modal: 0 24px 64px rgba(0, 0, 0, 0.7);\n\n  /* ---- Glows — TEFAMA's \"agent is alive\" signature ---- */\n  --glow-orange-sm: 0 0 12px rgba(255, 140, 0, 0.35);\n  --glow-orange-md: 0 0 24px rgba(255, 140, 0, 0.45);\n  --glow-orange-lg: 0 0 40px rgba(255, 140, 0, 0.55);\n  --glow-gold: 0 0 20px rgba(255, 215, 0, 0.5);\n  --glow-active: 0 0 18px rgba(255, 140, 0, 0.5);\n  --glow-danger: 0 0 18px rgba(255, 90, 31, 0.45);\n\n  /* Inset/ring used on focus & active brand surfaces */\n  --ring-brand: 0 0 0 2px var(--orange-a40);\n  --ring-focus: 0 0 0 3px rgba(255, 140, 0, 0.45);\n\n  /* Hairline gradients (orange edge highlight on cards) */\n  --edge-brand: linear-gradient(180deg, rgba(255, 140, 0, 0.5), rgba(255, 140, 0, 0)); /* @kind other */\n\n  /* ---- Motion ---- */\n  --ease-standard: cubic-bezier(0.4, 0, 0.2, 1); /* @kind other */\n  --ease-out: cubic-bezier(0.16, 1, 0.3, 1); /* @kind other */\n  --ease-in: cubic-bezier(0.4, 0, 1, 1); /* @kind other */\n  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1); /* @kind other */\n\n  --dur-fast: 120ms; /* @kind other */\n  --dur-base: 200ms; /* @kind other */\n  --dur-slow: 320ms; /* @kind other */\n  --dur-pulse: 2000ms; /* @kind other */\n}\n\n/* ---- Keyframes: the pulse/glow used on active agents ---- */\n@keyframes tefama-pulse {\n  0%, 100% {\n    box-shadow: 0 0 0 0 rgba(255, 140, 0, 0.5);\n  }\n  50% {\n    box-shadow: 0 0 16px 3px rgba(255, 140, 0, 0.22);\n  }\n}\n\n@keyframes tefama-glow-breathe {\n  0%, 100% {\n    box-shadow: var(--glow-orange-sm);\n  }\n  50% {\n    box-shadow: var(--glow-orange-lg);\n  }\n}\n\n@keyframes tefama-dot-blink {\n  0%, 100% { opacity: 1; }\n  50% { opacity: 0.35; }\n}\n\n@keyframes tefama-spin {\n  to { transform: rotate(360deg); }\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   TEFAMA DESIGN SYSTEM — global entry point.\n   Consumers link THIS file only. Imports must resolve the full\n   token + font closure. Keep this an @import list (+ base reset).\n   ============================================================ */\n\n/* TEFAMA webfonts — Geist Sans + Geist Mono (variable woff2, self-hosted) */\n\n@font-face {\n  font-family: \"Geist\";\n  src: url(\"c3914454-4716-4661-96b3-9b13584402cf\") format(\"woff2\");\n  font-weight: 100 900;\n  font-style: normal;\n  font-display: swap;\n}\n\n@font-face {\n  font-family: \"Geist Mono\";\n  src: url(\"b5cdc1a2-f482-4921-a8a0-521e1c98e51b\") format(\"woff2\");\n  font-weight: 100 900;\n  font-style: normal;\n  font-display: swap;\n}\n\n/* ============================================================\n   TEFAMA — COLOR TOKENS\n   Dark-first autonomous agent wallet. Warm-tinted neutrals,\n   bold orange primary, gold glow accent, on-chain semantics.\n   ============================================================ */\n\n:root {\n  /* ---- Brand: Orange (primary) ---- */\n  --orange-300: #ffbf73;\n  --orange-400: #ffa333;\n  --orange-500: #ff8c00; /* PRIMARY */\n  --orange-600: #e67c00;\n  --orange-700: #b86200;\n\n  /* ---- Brand: Gold (glow / highlight) ---- */\n  --gold-300: #ffe680;\n  --gold-400: #ffdb4d;\n  --gold-500: #ffd700; /* ACCENT */\n  --gold-600: #e6c200;\n\n  /* ---- Neutrals (warm-leaning dark) ---- */\n  --neutral-1000: #050505;\n  --neutral-950: #0a0a0a; /* base canvas */\n  --neutral-900 ;\n  --surface-elevated: var(--neutral-800);\n  --surface-overlay: rgba(5, 5, 5, 0.72);\n\n  /* Text */\n  --text-primary: #fafafa;\n  --text-secondary: var(--neutral-400);\n  --text-tertiary: var(--neutral-500);\n  --text-disabled: var(--neutral-600);\n  --text-brand: var(--orange-500);\n  --text-on-brand: #1a0e00;\n  --text-inverse: var(--neutral-950);\n\n  /* Borders */\n  --border-subtle: var(--white-a06);\n  --border-default: var(--white-a12);\n  --border-strong: var(--white-a18);\n  --border-brand: var(--orange-500);\n  --border-focus: var(--orange-400);\n\n  /* Brand surfaces */\n  --brand-solid: var(--orange-500);\n  --brand-solid-hover: var(--orange-400);\n  --brand-solid-press: var(--orange-600);\n  --brand-tint: var(--orange-a12);\n  --brand-tint-strong: var(--orange-a20);\n\n  /* Status semantics — orange (alive) vs neutral (idle) vs ember (danger) */\n  --status-active: var(--orange-500);\n  --status-active-tint: var(--orange-a12);\n  --status-confirmed: var(--orange-500);\n  --status-paused: var(--neutral-300);\n  --status-paused-tint: rgba(255, 255, 255, 0.07);\n  --status-revoked: var(--ember-500);\n  --status-revoked-tint: rgba(255, 90, 31, 0.13);\n  --status-pending: var(--neutral-300);\n  --status-pending-tint: rgba(255, 255, 255, 0.07);\n\n  /* Danger (revoke) — hot orange, not red */\n  --danger-solid: var(--ember-500);\n  --danger-solid-hover: #ff723d;\n  --danger-solid-press: var(--ember-600);\n  --danger-tint: var(--status-revoked-tint);\n}\n\n/* ============================================================\n   TEFAMA — TYPOGRAPHY TOKENS\n   Geist for UI/display, Geist Mono for amounts, hashes, data.\n   Tight tracking on display sizes (brand signature).\n   ============================================================ */\n\n:root {\n  /* Families */\n  --font-sans: \"Geist\", -apple-system, BlinkMacSystemFont, \"Segoe UI\", system-ui, sans-serif;\n  --font-mono: \"Geist Mono\", \"SF Mono\", \"JetBrains Mono\", ui-monospace, monospace;\n\n  /* Weights */\n  --weight-light: 300;\n  --weight-regular: 400;\n  --weight-medium: 500;\n  --weight-semibold: 600;\n  --weight-bold: 700;\n\n  /* ---- Type scale (mobile-first, px) ---- */\n  --text-display-size: 40px;\n  --text-display-lh: 44px;\n  --text-display-track: -0.03em;\n\n  --text-h1-size: 32px;\n  --text-h1-lh: 36px;\n  --text-h1-track: -0.025em;\n\n  --text-h2-size: 24px;\n  --text-h2-lh: 30px;\n  --text-h2-track: -0.02em;\n\n  --text-h3-size: 20px;\n  --text-h3-lh: 26px;\n  --text-h3-track: -0.015em;\n\n  --text-title-size: 17px;\n  --text-title-lh: 24px;\n  --text-title-track: -0.01em;\n\n  --text-body-size: 15px;\n  --text-body-lh: 22px;\n  --text-body-track: -0.005em;\n\n  --text-label-size: 14px;\n  --text-label-lh: 20px;\n  --text-label-track: 0;\n\n  --text-caption-size: 13px;\n  --text-caption-lh: 18px;\n  --text-caption-track: 0;\n\n  --text-micro-size: 11px;\n  --text-micro-lh: 14px;\n  --text-micro-track: 0.04em;\n\n  /* Numeric / mono (balances, budgets, hashes) */\n  --text-mono-amount-track: -0.02em;\n  --text-mono-data-track: 0;\n}\n\n/* ---- Reusable type role classes (specimen-friendly) ---- */\n.t-display {\n  font-family: var(--font-sans);\n  font-weight: var(--weight-semibold);\n  font-size: var(--text-display-size);\n  line-height: var(--text-display-lh);\n  letter-spacing: var(--text-display-track);\n}\n.t-h1 {\n  font-family: var(--font-sans);\n  font-weight: var(--weight-semibold);\n  font-size: var(--text-h1-size);\n  line-height: var(--text-h1-lh);\n  letter-spacing: var(--text-h1-track);\n}\n.t-h2 {\n  font-family: var(--font-sans);\n  font-weight: var(--weight-semibold);\n  font-size: var(--text-h2-size);\n  line-height: var(--text-h2-lh);\n  letter-spacing: var(--text-h2-track);\n}\n.t-h3 {\n  font-family: var(--font-sans);\n  font-weight: var(--weight-medium);\n  font-size: var(--text-h3-size);\n  line-height: var(--text-h3-lh);\n  letter-spacing: var(--text-h3-track);\n}\n.t-title {\n  font-family: var(--font-sans);\n  font-weight: var(--weight-semibold);\n  font-size: var(--text-title-size);\n  line-height: var(--text-title-lh);\n  letter-spacing: var(--text-title-track);\n}\n.t-body {\n  font-family: var(--font-sans);\n  font-weight: var(--weight-regular);\n  font-size: var(--text-body-size);\n  line-height: var(--text-body-lh);\n  letter-spacing: var(--text-body-track);\n}\n.t-label {\n  font-family: var(--font-sans);\n  font-weight: var(--weight-medium);\n  font-size: var(--text-label-size);\n  line-height: var(--text-label-lh);\n  letter-spacing: var(--text-label-track);\n}\n.t-caption {\n  font-family: var(--font-sans);\n  font-weight: var(--weight-regular);\n  font-size: var(--text-caption-size);\n  line-height: var(--text-caption-lh);\n  letter-spacing: var(--text-caption-track);\n}\n.t-micro {\n  font-family: var(--font-sans);\n  font-weight: var(--weight-medium);\n  font-size: var(--text-micro-size);\n  line-height: var(--text-micro-lh);\n  letter-spacing: var(--text-micro-track);\n  text-transform: uppercase;\n}\n.t-mono {\n  font-family: var(--font-mono);\n  font-weight: var(--weight-medium);\n  letter-spacing: var(--text-mono-amount-track);\n  font-variant-numeric: tabular-nums;\n  font-feature-settings: \"tnum\" 1;\n}\n\n/* ============================================================\n   TEFAMA — SPACING & SIZING TOKENS\n   4px base grid. Mobile layout rhythm.\n   ============================================================ */\n\n:root {\n  --space-0: 0;\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 20px;\n  --space-6: 24px;\n  --space-7: 32px;\n  --space-8: 40px;\n  --space-9: 48px;\n  --space-10: 64px;\n  --space-12: 80px;\n\n  /* Layout */\n  --screen-pad: 20px;        /* default horizontal gutter on mobile */\n  --section-gap: 24px;       /* space between dashboard sections */\n  --card-pad: 18px;          /* default card interior padding */\n  --stack-gap: 12px;         /* default vertical gap inside groups */\n\n  /* Touch targets */\n  --tap-min: 48px;           /* minimum touch target */\n  --control-h-sm: 36px;\n  --control-h-md: 44px;\n  --control-h-lg: 52px;\n\n  /* Component sizing */\n  --icon-sm: 16px;\n  --icon-md: 20px;\n  --icon-lg: 24px;\n  --avatar-sm: 32px;\n  --avatar-md: 40px;\n  --avatar-lg: 56px;\n\n  --bottomnav-h: 64px;\n  --appbar-h: 56px;\n}\n\n/* ============================================================\n   TEFAMA — EFFECTS TOKENS\n   Radii, shadows, glows (the autonomous \"alive\" signature),\n   motion easings & durations.\n   ============================================================ */\n\n:root {\n  /* ---- Corner radii ---- */\n  --radius-xs: 6px;\n  --radius-sm: 10px;\n  --radius-md: 14px;\n  --radius-lg: 18px;\n  --radius-xl: 24px;\n  --radius-2xl: 30px;\n  --radius-pill: 999px;\n  --radius-circle: 50%;\n\n  /* ---- Shadows (over near-black canvas) ---- */\n  --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.4);\n  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.45);\n  --shadow-md: 0 6px 20px rgba(0, 0, 0, 0.5);\n  --shadow-lg: 0 14px 40px rgba(0, 0, 0, 0.6);\n  --shadow-modal: 0 24px 64px rgba(0, 0, 0, 0.7);\n\n  /* ---- Glows — TEFAMA's \"agent is alive\" signature ---- */\n  --glow-orange-sm: 0 0 12px rgba(255, 140, 0, 0.35);\n  --glow-orange-md: 0 0 24px rgba(255, 140, 0, 0.45);\n  --glow-orange-lg: 0 0 40px rgba(255, 140, 0, 0.55);\n  --glow-gold: 0 0 20px rgba(255, 215, 0, 0.5);\n  --glow-active: 0 0 18px rgba(255, 140, 0, 0.5);\n  --glow-danger: 0 0 18px rgba(255, 90, 31, 0.45);\n\n  /* Inset/ring used on focus & active brand surfaces */\n  --ring-brand: 0 0 0 2px var(--orange-a40);\n  --ring-focus: 0 0 0 3px rgba(255, 140, 0, 0.45);\n\n  /* Hairline gradients (orange edge highlight on cards) */\n  --edge-brand: linear-gradient(180deg, rgba(255, 140, 0, 0.5), rgba(255, 140, 0, 0)); /* @kind other */\n\n  /* ---- Motion ---- */\n  --ease-standard: cubic-bezier(0.4, 0, 0.2, 1); /* @kind other */\n  --ease-out: cubic-bezier(0.16, 1, 0.3, 1); /* @kind other */\n  --ease-in: cubic-bezier(0.4, 0, 1, 1); /* @kind other */\n  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1); /* @kind other */\n\n  --dur-fast: 120ms; /* @kind other */\n  --dur-base: 200ms; /* @kind other */\n  --dur-slow: 320ms; /* @kind other */\n  --dur-pulse: 2000ms; /* @kind other */\n}\n\n/* ---- Keyframes: the pulse/glow used on active agents ---- */\n@keyframes tefama-pulse {\n  0%, 100% {\n    box-shadow: 0 0 0 0 rgba(255, 140, 0, 0.5);\n  }\n  50% {\n    box-shadow: 0 0 16px 3px rgba(255, 140, 0, 0.22);\n  }\n}\n\n@keyframes tefama-glow-breathe {\n  0%, 100% {\n    box-shadow: var(--glow-orange-sm);\n  }\n  50% {\n    box-shadow: var(--glow-orange-lg);\n  }\n}\n\n@keyframes tefama-dot-blink {\n  0%, 100% { opacity: 1; }\n  50% { opacity: 0.35; }\n}\n\n@keyframes tefama-spin {\n  to { transform: rotate(360deg); }\n}\n\n\n/* ---- Minimal base layer ---- */\n*,\n*::before,\n*::after {\n  box-sizing: border-box;\n}\n\nhtml {\n  -webkit-text-size-adjust: 100%;\n  text-rendering: optimizeLegibility;\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n}\n\nbody {\n  margin: 0;\n  font-family: var(--font-sans);\n  font-size: var(--text-body-size);\n  line-height: var(--text-body-lh);\n  letter-spacing: var(--text-body-track);\n  color: var(--text-primary);\n  background: var(--surface-base);\n}\n\nbutton {\n  font-family: inherit;\n}\n<\u002Fstyle>\n<script src=\"f40c7049-5e9f-4a62-8f96-add486503116\"><\u002Fscript>\n<script src=\"2ea6ecd4-57cd-41b9-ab4d-ebffe0a06410\"><\u002Fscript>\n<style>\n:root{\n  --orange-300:#7fe08f; --orange-400:#37c24f; --orange-500:#1fa13a; --orange-600:#178a31; --orange-700:#0f6323;\n  --gold-300:#d3f7a8; --gold-400:#a9f06c; --gold-500:#8ff05a; --gold-600:#6fd23f;\n  --orange-a12:rgba(31,161,58,0.12); --orange-a20:rgba(31,161,58,0.20); --orange-a40:rgba(31,161,58,0.40);\n  --green-glow:rgba(31,161,58,0.45); --text-on-brand:#042a0c;\n}\n*{box-sizing:border-box}\nhtml,body{margin:0;padding:0}\nbody{backgrou 1px;flex:1;min-height:22px;background:var(--border-subtle)\"><\u002Fspan>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-size:15px;font-weight:500\">{{ t.step }}<\u002Fdiv>\n              <div style=\"font-size:13px;color:var(--text-secondary);margin-top:3px\">{{ t.detail }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-family:'Geist Mono',monospace;font-size:12px;color:var(--text-tertiary)\">{{ t.at }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"padding-top:18px;border-top:1px solid var(--border-subtle);display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap\">\n        <span style=\"font-size:14px;color:var(--text-secondary)\">Ready for collection today from 4:00pm.<\u002Fspan>\n        <a href=\"https://wa.me/254720668668\" target=\"_blank\" style=\"display:flex;align-items:center;height:44px;padding:0 20px;border-radius:999px;border:1px solid var(--border-strong);color:var(--text-primary);font-size:14px\">Ask the technician<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ trackMissing }}\">\n    <div style=\"margin-top:26px;padding:22px;border:1px solid var(--border-default);border-radius:18px;background:var(--surface-card);font-size:14px;color:var(--text-secondary)\">No repair found for that number. Check the slip, or WhatsApp us on 0720 668 668 and we will look it up.<\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isTradein }}\">\n<div data-screen-label=\"Trade-in\" style=\"max-width:900px;margin:0 auto;padding:56px 20px 72px\">\n  <h1 style=\"margin:0;font-size:clamp(30px,4.6vw,48px);font-weight:700;letter-spacing:-0.032em\">Sell or trade in your phone<\u002Fh1>\n  <p style=\"margin:14px 0 0;font-size:17px;color:var(--text-secondary);max-width:620px;text-wrap:pretty\">We buy working and repairable phones, and take them off the price of anything in the shop. Pick yo l:'Cracked screen', mult:0.5 },\n  { id:'dead', label:'Not switching on', mult:0.28 }\n];\n\nconst TIMELINE = [\n  { step:'Received at the bench', detail:'Drop-off logged, free diagnostic queued', at:'09:12' },\n  { step:'Diagnostic complete', detail:'Display assembly faulty, board healthy. Quote approved by SMS.', at:'09:48' },\n  { step:'In repair', detail:'Original-grade panel being fitted by John K.', at:'11:20' },\n  { step:'Testing & collection', detail:'Touch, camera, speaker and charge test before handover', at:'Pending' }\n];\n\nconst money = n => n.toLocaleString('en-KE');\nconst round100 = n => Math.round(n / 100) * 100;\n\nclass Component extends DCLogic {\n  state = { route:'home', cart:{}, cartOpen:false, cat:'All', dev:null, issue:null, booked:false, booking:null, track:null, tiDev:null, tiCond:null };\n\n  refs = { name:React.createRef(), phone:React.createRef(), model:React.createRef(), date:React.createRef(), time:React.createRef(), ticket:React.createRef() };\n\n  nav(route) {\n    this.setState({ route, cartOpen:false });\n    if (typeof window !== 'undefined') window.scrollTo(0, 0);\n  }\n\n  addTo(id) {\n    this.setState(s => ({ cart: { ...s.cart, [id]: (s.cart[id] || 0) + 1 }, cartOpen:true }));\n  }\n\n  bump(id, d) {\n    this.setState(s => {\n      const cart = { ...s.cart };\n      const q = (cart[id] || 0) + d;\n      if (q <= 0) delete cart[id]; else cart[id] = q;\n      return { cart };\n    });\n  }\n\n  chip(active) {\n    return active\n      ? { edge:'var(--brand-solid)', bg:'var(--brand-tint-strong)' }\n      : { edge:'var(--border-default)', bg:'var(--surface-raised)' };\n  }\n\n  renderVals() {\n    const s = this.state;\n    const cartItems = Object.keys(s.cart).map(id => {\n      const p = PRODUCTS.find(x => x.id === id);\n      return { id, name:p.name, priceFmt:money(p.price), qty:s.cart[id],\n        inc:() => this.bump(id, 1), dec:() => this.bump(id, -1) };\n    });\n    const cartTotal = Object.keys(s.cart).reduce((t, id) => t + PRODUCTS.find(x => x.id === id).price * s.cart[id], 0);\n    const orderText = 'Hi BEAPS Mobile Fix, I would like to order:\\n' +\n      cartItems.map(c => `• ${c.qty} × ${c.name}`).join('\\n') +\n      `\\nTotal: KSh ${money(cartTotal)}`;\n\n    const dev = DEVICES.find(d => d.id === s.dev);\n    const issue = ISSUES.find(i => i.id === s.issue);\n    let estimate = '—', estimateLabel = 'Pick a device and a fault to see your range';\n    if (dev && issue) {\n      const low = round100(issue.base * dev.mult);\n      estimate = `KSh ${money(low)} – ${money(round100(low * 1.45))}`;\n      estimateLabel = `${issue.label} · ${dev.label}`;\n    }\n\n    const tiD = TI_DEVICES.find(d => d.id === s.tiDev);\n    const tiC = TI_CONDS.find(c => c.id === s.tiCond);\n    let offer = '—', offerLabel = 'Pick a device and condition for an indicative offer';\n    if (tiD && tiC) {\n      const val = round100(tiD.base * tiC.mult);\n      offer = `KSh ${money(round100(val * 0.85))} – ${money(val)}`;\n      offerLabel = `${tiD.label} · ${tiC.label.toLowerCase()}`;\n    }\n\n    const cats = ['All', ...Array.from(new Set(PRODUCTS.map(p => p.cat)))].map(label => ({\n      label, ...this.chip(s.cat === label), select: () => this.setState({ cat:label })\n    }));\n    const decorate = p => ({ ...p, priceFmt:money(p.price), add:() => this.addTo(p.id) });\n\n    const b = s.booking;\n    return {\n      go: { home:() => this.nav('home'), repairs:() => this.nav('repairs'), shop:() => this.nav('shop'),\n        quote:() => this.nav('quote'), book:() => this.nav('quote'), track:() => this.nav('track'),\n        tradein:() => this.nav('tradein'), about:() => this.nav('about'), contact:() => this.nav('contact') },\n      isHome: s.route === 'home', isRepairs: s.route === 'repairs', isShop: s.route === 'shop',\n      isQuote: s.route === 'quote', isTrack: s.route === 'track', isTradein: s.route === 'tradein',\n      isAbout: s.route === 'about', isContact: s.route === 'contact',\n\n      f: this.refs,\n      cartOpen: s.cartOpen, toggleCart:() => this.setState(x => ({ cartOpen: !x.cartOpen })),\n      hasCart: cartItems.length > 0, cartEmpty: cartItems.length === 0,\n      cartCount: cartItems.reduce((t, c) => t + c.qty, 0),\n      cartItems, cartTotalFmt: money(cartTotal),\n      waLink: 'https://wa.me/254720668668?text=' + encodeURIComponent(orderText),\n\n      featured: PRODUCTS.filter(p => ['p6','p4','p8','p13'].includes(p.id)).map(decorate),\n      shown: (s.cat === 'All' ? PRODUCTS : PRODUCTS.filter(p => p.cat === s.cat)).map(decorate),\n      cats,\n      repairs: REPAIRS.map(r => ({ ...r, priceFmt: money(r.price) })),\n\n      devices: DEVICES.map(d => ({ ...d, ...this.chip(s.dev === d.id), select:() => this.setState({ dev:d.id }) })),\n      issues: ISSUES.map(i => ({ ...i, ...this.chip(s.issue === i.id), select:() => this.setState({ issue:i.id }) })),\n      estimate, estimateLabel,\n\n      tiDevices: TI_DEVICES.map(d => ({ ...d, ...this.chip(s.tiDev === d.id), select:() => this.setState({ tiDev:d.id }) })),\n      tiConds: TI_CONDS.map(c => ({ ...c, ...this.chip(s.tiCond === c.id), select:() => this.setState({ tiCond:c.id }) })),\n      offer, offerLabel,\n\n      notBooked: !s.booked, booked: s.booked,\n      book: () => {\n        const r = this.refs;\n        const booking = {\n          name: (r.name.current && r.name.current.value) || 'Walk-in',\n          phone: (r.phone.current && r.phone.current.value) || '',\n          model: (r.model.current && r.model.current.value) || 'device',\n          date: (r.date.current && r.date.current.value) || 'the next open slot',\n          time: (r.time.current && r.time.current.value) || ''\n        };\n        this.setState({ booked:true, booking });\n      },\n      resetBooking: () => this.setState({ booked:false, booking:null }),\n      bookingSummary: b ? `${b.name}, we have your ${b.model} down for ${b.date} at ${b.time}. Room 420, 4th floor, Old Mutual Building. Confirm on WhatsApp and we will hold the slot.` : '',\n      bookingWaLink: b ? 'https://wa.me/254720668668?text=' + encodeURIComponent(`Hi BEAPS, I booked a repair.\\nName: ${b.name}\\nPhone: ${b.phone}\\nDevice: ${b.model}\\nFault: ${issue ? issue.label : 'to be diagnosed'}\\nSlot: ${b.date} ${b.time}`) : '',\n\n      lookup: () => {\n        const v = ((this.refs.ticket.current && this.refs.ticket.current.value) || '').trim().toUpperCase();\n        this.setState({ track: v === 'BMF-1042' ? 'found' : 'missing' });\n      },\n      trackFound: s.track === 'found', trackMissing: s.track === 'missing',\n      timeline: TIMELINE.map((t, i) => ({ ...t,\n        dot: i < 3 ? 'var(--brand-solid)' : 'var(--neutral-600)',\n        glow: i === 2 ? '0 0 12px var(--green-glow)' : 'none' }))\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
